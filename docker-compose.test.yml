name: venote-gpu-test

services:
  backend:
    build: .
    command: python3 -m app.main
    runtime: nvidia
    env_file:
      - .env
    environment:
      SQLITE_DB_PATH: data/venote_gpu_test.db
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    ports:
        - "127.0.0.1:48727:8000"
    depends_on:
      - qdrant
    volumes:
      - ./app:/app/app
      - hf_cache:/root/.cache/huggingface
      - ./tests:/app/tests
      
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  hf_cache: